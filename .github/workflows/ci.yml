name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, format, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Build, and fail if any route is not static
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q "ƒ" build.log; then
            echo "A route rendered dynamically. Every route on this site must prerender." && exit 1
          fi

  accessibility:
    name: Accessibility and layout (axe, 375 and 1440 px)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:a11y
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets (mobile)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Score the artifact production will serve. Without this, next.config.ts adds
    # the preview X-Robots-Tag: noindex header (PTR-13) and the SEO audit
    # is-crawlable fails by design. The noindex header itself is covered by
    # e2e/noindex.spec.ts in the accessibility job.
    env:
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:lighthouse
      - name: Check robots.txt and sitemap (production build)
        run: |
          npm run start -- -p 3200 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200/ >/dev/null && break; sleep 1; done
          node scripts/check-seo.mjs http://localhost:3200
